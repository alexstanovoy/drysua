global:
  scrape_interval: 5s
  scrape_timeout: 2s
  evaluation_interval: 5s

rule_files:
  - /etc/prometheus/rules.yml

scrape_configs:
  - job_name: drysua
    metrics_path: /metrics
    scrape_protocols: [PrometheusText0.0.4]
    body_size_limit: 2MB
    sample_limit: 10000
    target_limit: 1
    label_limit: 16
    label_name_length_limit: 64
    label_value_length_limit: 256
    static_configs:
      - targets: [127.0.0.1:9464]
