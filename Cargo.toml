[package]
name = "drysua"
version = "0.1.0"
edition = "2024"

[features]
default = []
builtin = ["dep:bota-server"]
cuda = ["dep:candle-cuda-feature"]
metal = ["dep:candle-metal-feature"]

[dependencies]
bota-proto = { path = "../bota/crates/bota-proto", default-features = false }
bota-server = { path = "../bota/crates/bota-server", default-features = false, optional = true }
candle-core = { version = "0.11.0", default-features = false }
clap = { version = "4.6.6", default-features = false, features = ["derive", "error-context", "help", "std", "suggestions", "usage"] }
# Integer-key lookup maps where iteration order does not affect behavior.
rustc-hash = { version = "2.1.3", default-features = false, features = ["std"] }
safetensors = { version = "0.8.0", default-features = false, features = ["std"] }
sha2 = { version = "0.11.0", default-features = false }
# Inline storage for small bounded candidate/mask collections (hot action path).
smallvec = { version = "1.15.2", default-features = false, features = ["const_generics"] }

[target.'cfg(any(target_os = "linux", target_os = "windows"))'.dependencies]
candle-cuda-feature = { path = "crates/candle-cuda-feature", default-features = false, optional = true }

[target.'cfg(unix)'.dependencies]
# std has no signal API; reuse the locked libc for standalone metrics shutdown.
libc = { version = "=0.2.189", default-features = false }

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.61.2", default-features = false, features = ["Win32_Storage_FileSystem"] }

[target.'cfg(target_os = "macos")'.dependencies]
candle-metal-feature = { path = "crates/candle-metal-feature", default-features = false, optional = true }

[dev-dependencies]
# Mirrors bota's workspace pin so the shared bench tooling version moves in lockstep.
criterion = { version = "=0.8.2", default-features = false }
serde_json = { version = "1.0.151", default-features = false, features = ["std"] }

[[bin]]
name = "drysua"
path = "src/main.rs"

[[bin]]
name = "drysua-profile"
path = "src/bin/drysua_profile.rs"
required-features = ["builtin"]

[[bench]]
name = "training"
path = "benches/training.rs"
harness = false
required-features = ["builtin"]

[lints.clippy]
float_arithmetic = "deny"

# Tests always run optimized: the project requires O2 for every test target,
# and the dev profile they inherit must not silently fall back to O0.
[profile.dev]
opt-level = 2

[profile.test]
opt-level = 2
